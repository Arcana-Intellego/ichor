[pytest]
# M16 Day 4 P14: pytest marker registration + default opts.
#
# Markers are registered here so `pytest -m "not live and not slow"`
# produces a fast iteration loop on a developer machine, and so the
# GitHub Actions CI jobs (.github/workflows/run_tests.yml) can deselect
# live-mode tests cleanly without --strict-markers warnings.

markers =
    live: requires live cluster backends (sbatch, sacct, Gaussian, AIMAll, FEREBUS, ARIADNE).
    slow: tests that take >30s; deselect by default on CI runners.
    integration: end-to-end multi-phase tests that drive the daemon.

# Discover tests across all three packages without needing a top-level
# conftest. Each package's tests root is named tests/.
testpaths =
    ichor_core/tests
    ichor_hpc/tests
    ichor_cli/tests

# Always print warnings; useful for catching API deprecations early.
filterwarnings =
    default
