name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

jobs:
  run_linter:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        pip install pre-commit
        pre-commit install
    - name: Run pre-commit
      run: | # taken from https://pre-commit.com/#pre-commit-run
        git ls-files -- '*.py' | xargs pre-commit run --files
    # upload when open sourced
    # - name: Upload coverage reports to Codecov
    #   uses: codecov/codecov-action@v3

  run_ichor_core_tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        pip install -e ichor_core[dev]
        pip install -e ichor_hpc
        pip install -e ichor_cli
    - name: Run pytest (ichor_core)
      run: |
        pytest ichor_core/tests -m "not live and not slow"

  run_ichor_hpc_tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        pip install -e ichor_core[dev]
        pip install -e ichor_hpc
        pip install -e ichor_cli
    - name: Run pytest (ichor_hpc)
      # M16-P12: live-mode tests need a real cluster + Gaussian / AIMAll /
      # FEREBUS / ARIADNE binaries; deselect them on GitHub runners.
      run: |
        pytest ichor_hpc/tests -m "not live and not slow and not integration"

  run_daemon_integration_tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        pip install -e ichor_core[dev]
        pip install -e ichor_hpc
        pip install -e ichor_cli
    - name: Run offline daemon integration tests
      run: |
        pytest ichor_hpc/tests/test_active_learning/test_live_one_iter.py -m integration

  run_ichor_cli_tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        pip install -e ichor_core[dev]
        pip install -e ichor_hpc
        pip install -e ichor_cli
    - name: Run pytest (ichor_cli)
      run: |
        pytest ichor_cli/tests -m "not live and not slow"

  run_examples:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        pip install -e ichor_core[dev]
        pip install -e ichor_hpc
        pip install -e ichor_cli
    - name: Run example notebooks
      run: |
        git ls-files -- '*.ipynb' | xargs pytest --nbval-lax --nbval-current-env
