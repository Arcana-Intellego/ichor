schema_version: 9

campaign:
  system_name: ICHOR_CSF4_LONG_CAMPAIGN
  max_iterations: 20

# Production-style starting point. Calibrate thresholds from one first-live
# campaign before increasing batch sizes further.
point_allocation:
  bootstrap_training_size: 64
  bootstrap_internal_validation_size: 16
  bootstrap_external_validation_size: 20
  batch_training_size: 6
  batch_internal_validation_size: 2
  anchor: false

seed_selection:
  strategy: d_optimal
  n_seeds_per_iteration: 16
  bulk_fraction: 0.2

sampling_protocol:
  # 1 conservative, 5 balanced/current default, 10 exploratory within hard safety gates.
  sampling_aggressiveness: 5

resources:
  defaults:
    partition: multicore
  gaussian:
    memory_mode: slurm_env
  array_concurrency_limit: 8

error_calibration:
  mode: record_only
  model_version_policy: current
