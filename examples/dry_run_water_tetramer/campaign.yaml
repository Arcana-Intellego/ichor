# Tuned for a fast walkthrough (~30s end-to-end). Two iterations,
# tiny seed counts, small training batch. Real campaigns would lift these
# defaults substantially (see ichor_hpc/.../presets/ for spectroscopy and
# thermodynamics-focused starting points).

schema_version: 3
system_name: WATER_TETRAMER

# Iteration loop.
max_iterations: 2
poll_interval_seconds: 1

# Initial sub-sampling.
initial_train_size: 4
initial_val_size: 2

# Batch sizing per iteration.
batch_sizing:
  policy: linear
  floor: 2
  cap: 4

# Seeds per ARIADNE_ARRAY task.
seed_selection:
  n_seeds_per_iteration: 2
  bulk_fraction: 0.5

resources:
  partition: multicore
  default_walltime_hours: 1
  polus_cpus_per_task: auto
  gaussian_cpus_per_task: auto
  aimall_cpus_per_task: auto
  ariadne_cpus_per_task: 2
  ferebus_cpus_per_task: auto
  polus_mem_per_cpu: auto
  gaussian_mem_per_cpu: auto
  aimall_mem_per_cpu: auto
  ariadne_mem_per_cpu: auto
  ferebus_mem_per_cpu: auto
  gaussian_memory_mode: slurm_env
  gaussian_link0_mem: 8GB
  gaussian_memory_fraction_of_slurm: 0.85
  array_concurrency_limit: null

gaussian:
  method: B3LYP
  basis_set: aug-cc-pVTZ

aimall:
  nogui: true
  naat: auto
  encomp: 3
  boaq: auto_gs2
  iasmesh: medium

ferebus:
  scaling: false
