# Tuned for a fast walkthrough (~30s end-to-end). Two iterations,
# tiny seed counts, small training batch. Real campaigns would lift these
# defaults substantially (see ichor_hpc/.../presets/ for spectroscopy and
# thermodynamics-focused starting points).

schema_version: 5
system_name: WATER_TETRAMER

# Iteration loop.
max_iterations: 2
poll_interval_seconds: 1

# Initial sub-sampling.
initial_train_size: 4
initial_val_size: 2

# Batch sizing per iteration.
batch_sizing:
  policy: linear
  floor: 2
  cap: 4

# Seeds per ARIADNE_ARRAY task.
seed_selection:
  n_seeds_per_iteration: 2
  bulk_fraction: 0.5

resources:
  defaults:
    partition: multicore
    walltime_hours: 1
    cpus_per_task: auto
    mem_per_cpu: auto
  ariadne:
    cpus_per_task: 2
  gaussian:
    memory_mode: slurm_env
    link0_mem: 8GB
    memory_fraction_of_slurm: 0.85
  array_concurrency_limit: null

gaussian:
  method: B3LYP
  basis_set: aug-cc-pVTZ

aimall:
  nogui: true
  naat: auto
  encomp: 3
  boaq: auto_gs2
  iasmesh: medium

ferebus:
  scaling: false
