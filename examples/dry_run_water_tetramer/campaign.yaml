# Tuned for a fast walkthrough (~30s end-to-end). Two iterations,
# tiny seed counts, small training batch. Real campaigns would lift these
# defaults substantially. Production campaigns should calibrate the single
# sampling-aggressiveness policy against their own system.

schema_version: 13

campaign:
  system_name: WATER_TETRAMER
  max_iterations: 2
  custom_bootstrap: false
  # Keep the walkthrough close to the balanced production default.
  sampling_aggressiveness: 5
  random_seed: 0

# Iteration loop.
runtime:
  poll_interval_seconds: 1
  background_readiness_timeout_seconds: 60

# Initial labelled set before active learning.
point_allocation:
  bootstrap_training_size: 4
  bootstrap_internal_validation_size: 1
  bootstrap_external_validation_size: 1
  batch_training_size: 1
  batch_internal_validation_size: 1

# Seeds per ARIADNE_ARRAY task.
seed_selection:
  n_seeds_per_iteration: 2
  bulk_fraction: 0.2
  strategy: d_optimal
  d_optimal_degenerate_policy: score_backfill
  exclude_committed_seed_frames: true
  recent_seed_cooldown_iterations: 1

resources:
  defaults:
    partition: multicore
    walltime_hours: 1
    cpus_per_task: auto
    mem_per_cpu: auto
  polus:
    auto_max_workers: 16
    target_pairs_per_worker: 5000000
    in_memory_distance_store_fraction: 0.35
  ariadne:
    cpus_per_task: 2
  gaussian:
    memory_mode: slurm_env
    link0_mem: 8GB
    memory_fraction_of_slurm: 0.85
  array_concurrency_limit: 4
  memory_estimate_safety_factor: 1.25
  scheduler_usage_telemetry: true
  scheduler_usage_history_limit: 5000

gaussian:
  method: B3LYP
  basis_set: aug-cc-pVTZ
  extra_route_keywords: []

aimall:
  nogui: true
  naat: auto
  encomp: 3
  boaq: auto_gs2
  iasmesh: medium

ferebus:
  feature_scaling: false
  property_scaling: false

quality_gates:
  ferebus_max_aggregate_ext_rmse_increase_fraction: 0.05
  ferebus_max_task_ext_rmse_increase_fraction: 0.20
  ferebus_regression_abs_tolerance_ha: 1.0e-6

retention:
  checkpoint_destination: null
  checkpoint_every_iterations: 1
  checkpoint_required: false
  checkpoint_verify_after_write: true
