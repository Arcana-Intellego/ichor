# campaign.yaml
# Generic first-live-iteration active-learning campaign for CSF3/CSF4.
# Intended for a small validation run, not a long production campaign.

schema_version: 13

# -------------------------------------------------------------------------
# Required system-level identifiers
# -------------------------------------------------------------------------

campaign:
  # Filename-safe token: letters/numbers/_/-, no spaces.
  system_name: CHANGE_ME_SYSTEM

  # First live iteration only.
  # This means: bootstrap initial training/model, then run one active-learning loop.
  max_iterations: 1

  # 1 conservative, 5 balanced/current default, 10 exploratory. Runtime trust
  # radii are normalised for molecular size and remain bounded by safety gates.
  sampling_aggressiveness: 5

  # Immutable root for all deterministic component seeds.
  random_seed: 0

  # When true, init inspects the campaign-relative bootstrap/ directory for
  # split-specific XYZ/CSV inputs or a model_krig training baseline.
  custom_bootstrap: false

# Keep first-live examples small enough to debug quickly. With the default
# 20-frame smoke pool, 12 + 1 * 8 = 20 frames are required.
point_allocation:
  bootstrap_training_size: 8
  bootstrap_internal_validation_size: 2
  bootstrap_external_validation_size: 2
  batch_training_size: 3
  batch_internal_validation_size: 1

# -------------------------------------------------------------------------
# Active batch and seed selection
# -------------------------------------------------------------------------

seed_selection:
  n_seeds_per_iteration: 8
  bulk_fraction: 0.2
  variance_chunk_size: 512
  strategy: d_optimal
  d_optimal_pool_multiplier: 8
  d_optimal_jitter: 1.0e-12
  d_optimal_novelty_floor: 1.0e-12
  d_optimal_score_power: 1.0
  d_optimal_degenerate_policy: score_backfill
  exclude_committed_seed_frames: true
  recent_seed_cooldown_iterations: 1

phase_b:
  descriptor: hybrid_alf_rmsd
  beta: 0.5

# -------------------------------------------------------------------------
# FEREBUS
# -------------------------------------------------------------------------

ferebus:
  kernel: rbfc_per
  loss: huber
  nagents: 20
  maxiter: 200
  is_constant_noise: true
  prior_mean_type: 21
  prior_mean_level_of_theory: auto
  prior_mean_iqa_deviation_factor: 1.0
  feature_scaling: true
  property_scaling: false
  full_ARD: true
  properties:
    - iqa

error_calibration:
  enabled: true
  mode: record_only
  min_records_to_apply: 100
  min_model_versions_to_apply: 2
  n_bins: 10
  min_bin_records: 8
  max_records: 5000
  max_model_age_iterations: 10
  monotone_estimator: true
  quantile: 0.75
  apply_strength: 0.0
  group_by_atom_type: true
  group_by_landing_policy: false
  model_version_policy: rolling_normalised
  aggressiveness_match_required: true
  output_units: ha

quality_gates:
  require_readable_aimall_geometry: true
  require_finite_iqa: true
  require_finite_integration_error: true
  ferebus_max_aggregate_ext_rmse_increase_fraction: 0.05
  ferebus_max_task_ext_rmse_increase_fraction: 0.20
  ferebus_regression_abs_tolerance_ha: 1.0e-6
  ariadne_max_displacement_ang: 1.25
  ariadne_min_pair_distance_ang: 0.60

# -------------------------------------------------------------------------
# Daemon runtime
# -------------------------------------------------------------------------

runtime:
  poll_interval_seconds: 60
  poll_interval_idle_seconds: 120
  poll_sacct_empty_max_ticks: 10
  lease_stale_seconds: 900
  postprocess_settle_attempts: 3
  postprocess_settle_seconds: 10
  transient_phase_retry_max: 1
  poll_sacct_unknown_max_ticks: 3
  poll_sacct_error_max_ticks: 10
  poll_sacct_missing_max_ticks: 12
  poll_squeue_inconclusive_max_ticks: 10
  failure_threshold_fraction: 0.5
  halt_on_tick_exception: true
  scheduler_command_timeout_seconds: 60
  cancellation_confirmation_timeout_seconds: 120
  journal_max_bytes: 67108864
  journal_retained_files: 8
  lease_heartbeat_seconds: 30
  lease_heartbeat_failure_max: 3
  clock_skew_tolerance_seconds: 60
  background_readiness_timeout_seconds: 60
  ledger_lock_timeout_seconds: 30

retention:
  checkpoint_destination: null
  checkpoint_every_iterations: 1
  checkpoint_required: false
  checkpoint_verify_after_write: true

stop:
  alpha0_streak_threshold: 1.0e-2
  alpha0_streak_length: 5
  rel_alpha_improvement_min: 0.02
  rel_alpha_improvement_window: 3
  min_iterations_before_stop: 8

# -------------------------------------------------------------------------
# Slurm resources
# -------------------------------------------------------------------------

resources:
  defaults:
    partition: multicore
    walltime_hours: 24
    cpus_per_task: auto
    mem_per_cpu: auto

  # Backend resources are explicit defaults; adjust per backend when needed.
  diversity:
    partition: multicore
    walltime_hours: 2
    cpus_per_task: auto
    mem_per_cpu: auto
    auto_max_workers: 16
    target_pairs_per_worker: 5000000
    in_memory_distance_store_fraction: 0.35

  gaussian:
    partition: multicore
    walltime_hours: 24
    cpus_per_task: auto
    mem_per_cpu: auto
    memory_mode: slurm_env
    link0_mem: 8GB
    memory_fraction_of_slurm: 0.85

  aimall:
    partition: multicore
    walltime_hours: 24
    cpus_per_task: auto
    mem_per_cpu: auto

  ariadne:
    partition: multicore
    walltime_hours: 4
    cpus_per_task: auto
    mem_per_cpu: auto

  ferebus:
    partition: multicore
    walltime_hours: 24
    cpus_per_task: auto
    mem_per_cpu: auto

  memory_estimate_safety_factor: 1.25
  scheduler_usage_telemetry: true
  scheduler_usage_history_limit: 5000

  # Keep the first live example gentle on the scheduler.
  # For larger campaigns, increase or remove this.
  array_concurrency_limit: 4

  # Use process parallelism for the active_fd gradient path.
  gradient_parallel_backend: process

# -------------------------------------------------------------------------
# Quantum chemistry / AIMAll
# -------------------------------------------------------------------------

gaussian:
  method: B3LYP
  basis_set: aug-cc-pVTZ

  # CHANGE THESE PER SYSTEM.
  charge: 0
  spin_multiplicity: 1

  extra_route_keywords: []

aimall:
  encomp: 3
  nogui: true
  naat: auto
  boaq: auto_gs2
  iasmesh: medium
