# minimal one-iteration campaign config for the first CSF3 live smoke.
# see README.md in this directory for the full walkthrough.

schema_version: 2
system_name: WATER

max_iterations: 1
poll_interval_seconds: 60

initial_train_size: 8
initial_val_size: 2

batch_sizing:
  policy: linear
  floor: 4
  cap: 8

seed_selection:
  n_seeds_per_iteration: 4
  bulk_fraction: 0.5

resources:
  partition: multicore
  walltime_hours: 2
  polus_walltime_hours: 1
  gaussian_walltime_hours: 2
  aimall_walltime_hours: 2
  ariadne_walltime_hours: 1
  ferebus_walltime_hours: 2
  mem_per_cpu: auto
  cpus_per_task: 2
  ntasks: 1
  aimall_cpus_per_task: 8
  ariadne_cpus_per_task: 8
  array_concurrency_limit: null

gaussian:
  nproc: 2
  memory_mode: slurm_env

aimall:
  nogui: true
  naat: auto
  encomp: 3
  boaq: auto_gs2
  iasmesh: medium

ariadne:
  optimiser: trust_region_qn
  hessian_model: SCHLEGEL
  max_iter: 50
  gradf_tol: 1.0e-4
  trqn_scale_mode: adaptive_initial_gradient
  trqn_target_initial_grad_norm: 0.01
  trqn_retry_target_initial_grad_norm: 0.003
  trqn_retry_on_no_proposal: true
  trqn_backtransform_mode: geodesic
  trqn_geodesic_bt_mode: dense
  trqn_geodesic_dt: 1.0e-2
  trqn_geodesic_tol: 1.0e-8
  trqn_bt_ic_tol: 1.0e-6
  trqn_max_backtransform_iter: 50
  trqn_trust_min: 1.0e-4

ferebus:
  scaling: false

runtime:
  poll_sacct_missing_max_ticks: 30
  poll_sacct_unknown_max_ticks: 3
  postprocess_settle_attempts: 3
  postprocess_settle_seconds: 10
  transient_phase_retry_max: 1

quality_gates:
  ariadne_max_displacement_ang: 1.25
  ariadne_min_pair_distance_ang: 0.60

error_calibration:
  enabled: true
  mode: record_only
  apply_strength: 0.0
