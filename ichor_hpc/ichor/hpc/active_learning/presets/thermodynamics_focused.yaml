# Thermodynamics-focused preset.
#
# WARNING: this preset is NOT yet calibrated against any benchmark dataset.
# Treat the values as best guesstimation;
# the calibration record below will be populated once we have some real data.
#
# Calibration status: PENDING
#
# Downstream goal: ROBUSTNESS - train an IQA MLP whose forces are accurate enough to
# stabilise long NVE / NVT trajectories for thermodynamic averages.
# Force accuracy dominates over peak-position accuracy.
#
# Notes on the choices made:
#  * lambda_force is raised (force-dominant acquisition).
#  * lambda_energy is raised slightly so the global PES shape is
#    reasonable across the trajectory range.
#  * mode_weighting_policy stays at variance: the dominant high-variance
#    modes typically carry most of the force-error signal.
#  * Everything else stays at the balanced defaults.

schema_version: 6

acquisition:
  subspace:
    mode_weighting_policy: variance
  weights:
    lambda_force: 1.5
    lambda_frequency: 1.5
    lambda_anharmonic: 1.0
    lambda_energy: 0.5
    lambda_distance: 1.0
